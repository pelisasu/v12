name: v18.0

# ════════════════════════════════════════════════════════════
# TRIGGER
# ════════════════════════════════════════════════════════════
on:
  # Jadwal otomatis — tiap 5 menit (killzone difilter di kode)
  schedule:
    - cron: '*/5 * * * *'

  # Manual dari tab Actions
  workflow_dispatch:
    inputs:
      command:
        description: 'Perintah yang dijalankan'
        required: true
        default: 'smoke'
        type: choice
        options:
          - run
          - smoke
          - selftest
          - test-tg

  # Validasi saat push (hanya smoke test, tidak kirim sinyal)
  push:
    branches: [main, master]
    paths:
      - 'apex_v18.py'
      - '.github/workflows/apex.yml'

# ════════════════════════════════════════════════════════════
# PERMISSIONS & CONCURRENCY
# ════════════════════════════════════════════════════════════
permissions:
  contents: read

# Hindari run paralel (race condition di Gist)
concurrency:
  group: apex-predator-v18
  cancel-in-progress: false

# ════════════════════════════════════════════════════════════
# JOB UTAMA — RUN APEX
# ════════════════════════════════════════════════════════════
jobs:
  apex:
    name: APEX v18 Run
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.event_name != 'push'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Requirements embedded (single-file setup) ──
      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            "numpy>=1.24,<3" \
            "pandas>=2.0,<3" \
            "requests>=2.31" \
            "scikit-learn>=1.3" \
            "scipy>=1.11"

      # Sanity check import sebelum lanjut
      - name: 🔎 Verify imports
        run: |
          python - <<'PY'
          import numpy, pandas, requests, sklearn, scipy
          print("numpy    ", numpy.__version__)
          print("pandas   ", pandas.__version__)
          print("requests ", requests.__version__)
          print("sklearn  ", sklearn.__version__)
          print("scipy    ", scipy.__version__)
          PY

      - name: 🧪 Selftest (wajib lulus)
        env:
          APEX_DRY_RUN: 'false'
        run: python apex_v18.py selftest

      - name: 🚀 Execute command
        env:
          # ─── Secrets (Settings → Secrets → Actions) ───
          GIST_ID:              ${{ secrets.GIST_ID }}
          GIST_TOKEN:           ${{ secrets.GIST_TOKEN }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_KEY:        ${{ secrets.OANDA_API_KEY }}
          TWELVE_DATA_API_KEY:  ${{ secrets.TWELVE_DATA_API_KEY }}

          # ─── Runtime config (override sesuai kebutuhan) ───
          APEX_DRY_RUN:                     'false'
          APEX_SYMBOL:                      'XAUUSD'
          APEX_ACCOUNT_BALANCE:             '1000'
          APEX_MAX_RISK_PCT_PER_TRADE:      '1.0'
          APEX_MAX_DAILY_LOSS_PCT:          '3.0'
          APEX_MAX_CONSECUTIVE_LOSSES:      '3'
          APEX_MAX_DAILY_SIGNALS:           '5'
          APEX_NEWS_BLACKOUT_MIN:           '30'
          APEX_ENABLE_ML_MODELS:            'true'
          APEX_MT5_OFFSET:                  '0.0'
          APEX_KILL_SWITCH:                 'false'
        run: |
          CMD="${{ github.event.inputs.command || 'run' }}"
          echo "▶️ python apex_v18.py $CMD"
          python apex_v18.py "$CMD"

      - name: 📋 Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-state-${{ github.run_number }}
          path: apex_state_v18.json
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧾 Run summary
        if: always()
        run: |
          {
            echo "### APEX v18.0 Run"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Command | \`${{ github.event.inputs.command || 'run' }}\` |"
            echo "| Status | ${{ job.status }} |"
            echo "| Time | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |"
          } >> $GITHUB_STEP_SUMMARY

# ════════════════════════════════════════════════════════════
# JOB VALIDASI — hanya jalan saat push
# ════════════════════════════════════════════════════════════
  validate-on-push:
    name: Validate on Push (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            "numpy>=1.24,<3" \
            "pandas>=2.0,<3" \
            "requests>=2.31" \
            "scikit-learn>=1.3" \
            "scipy>=1.11"

      - name: 🧪 Selftest
        run: python apex_v18.py selftest

      - name: 💨 Smoke test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          OANDA_API_KEY:       ${{ secrets.OANDA_API_KEY }}
          APEX_DRY_RUN:        'true'
        run: python apex_v18.py smoke
