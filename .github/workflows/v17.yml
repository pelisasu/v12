name: v17.0

# ============================================================
# TRIGGER
# ============================================================
on:
  # Jadwal otomatis — tiap 5 menit (minimum GH Actions)
  # Killzone sudah difilter di dalam kode (London/NY)
  schedule:
    - cron: '*/5 * * * *'

  # Trigger manual dari tab Actions
  workflow_dispatch:
    inputs:
      command:
        description: 'Perintah yang dijalankan'
        required: true
        default: 'smoke'
        type: choice
        options:
          - run
          - smoke
          - selftest
          - test-tg

  # Trigger saat kode di-push
  push:
    branches: [main, master]
    paths:
      - 'apex_v17.py'
      - '.github/workflows/apex.yml'

# ============================================================
# PERMISSIONS & CONCURRENCY
# ============================================================
permissions:
  contents: read

# Pastikan tidak ada 2 run barengan (menghindari race condition di Gist)
concurrency:
  group: apex-predator
  cancel-in-progress: false

# ============================================================
# JOBS
# ============================================================
jobs:
  apex:
    name: APEX v17 Run
    runs-on: ubuntu-latest
    timeout-minutes: 8

    # Skip untuk push event (hanya jalankan smoke test)
    if: github.event_name != 'push'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 📦 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            numpy \
            pandas \
            requests \
            scikit-learn \
            scipy

      - name: 🧪 Selftest (wajib lulus)
        env:
          APEX_DRY_RUN: 'false'
        run: python apex_v17.py selftest

      - name: 🚀 Execute command
        env:
          # ---- Kredensial (set di repo Settings > Secrets) ----
          GIST_ID:                ${{ secrets.GIST_ID }}
          GIST_TOKEN:             ${{ secrets.GIST_TOKEN }}
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_KEY:          ${{ secrets.OANDA_API_KEY }}
          TWELVE_DATA_API_KEY:    ${{ secrets.TWELVE_DATA_API_KEY }}

          # ---- Konfigurasi APEX (dapat dioverride) ----
          APEX_DRY_RUN:           'false'
          APEX_SYMBOL:            'XAUUSD'
          APEX_ACCOUNT_BALANCE:   '1000'
          APEX_MAX_RISK_PCT_PER_TRADE: '2.0'
          APEX_MAX_DAILY_LOSS_PCT: '4.0'
          APEX_MAX_CONSECUTIVE_LOSSES: '3'
          APEX_MAX_DAILY_SIGNALS: '5'
          APEX_MT5_OFFSET:        '0.0'
        run: |
          # Tentukan command dari input manual atau default 'run' untuk schedule
          CMD="${{ github.event.inputs.command || 'run' }}"
          echo "▶️ Running: python apex_v17.py $CMD"
          python apex_v17.py "$CMD"

      - name: 📋 Upload local state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-state-${{ github.run_number }}
          path: apex_state_v17.json
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧾 Log summary
        if: always()
        run: |
          echo "### APEX v17.0 Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Command**: \`${{ github.event.inputs.command || 'run' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

# ============================================================
# PUSH VALIDATION JOB (hanya smoke test, tidak kirim sinyal)
# ============================================================
  validate-on-push:
    name: Validation on Push (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir numpy pandas requests scikit-learn scipy

      - name: 🧪 Selftest
        run: python apex_v17.py selftest

      - name: 💨 Smoke test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          OANDA_API_KEY:       ${{ secrets.OANDA_API_KEY }}
          APEX_DRY_RUN:        'true'
        run: python apex_v17.py smoke
