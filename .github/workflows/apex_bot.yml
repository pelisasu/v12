name: APEX Bot v12

on:
  schedule:
    - cron: "*/15 6-10,12-16,17-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: apex-bot-v12
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GIST_ID: ${{ secrets.GIST_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      APEX_DRY_RUN: "true"
      APEX_ACCOUNT_BALANCE: "1000"
      APEX_MAX_RISK_PCT_PER_TRADE: "2.0"
      APEX_HARD_LEVERAGE_CAP: "50"
      APEX_MAX_DAILY_LOSS_PCT: "4.0"
      APEX_M5_FETCH_SIZE: "4500"
      APEX_MAX_CONSECUTIVE_LOSSES: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Selftest (fail-fast if broken)
        run: python apex_v12.py selftest
      - name: Run bot
        run: python apex_v12.py run
      - name: Show recent journal
        if: always()
        run: python apex_v12.py reports | head -n 20
      - name: Show stats
        if: always()
        run: python apex_v12.py stats
